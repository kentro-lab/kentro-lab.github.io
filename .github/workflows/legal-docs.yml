name: Legal Docs

# The legal pages (<product>/<page>/index.html) are GENERATED from legal/*.md
# (legal/build.py = pandoc + legal/template.html). This guard regenerates them
# and fails if any committed HTML drifts from its Markdown source, so the public
# privacy/support pages can never diverge from what was reviewed. GitHub Pages
# serves the committed HTML (it does not run pandoc), so the generated files are
# committed and this check keeps them honest.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  legal-docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Regenerate legal HTML and check freshness
        run: |
          python3 legal/build.py
          if [ -n "$(git diff --name-only)" ]; then
            echo "❌ A generated legal page is out of date with its Markdown source."
            echo "   Run 'python3 legal/build.py' and commit the result."
            git diff --name-only
            exit 1
          fi
          echo "✅ Legal pages are in sync with their Markdown sources."
