<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{TITLE}}</title>
  <meta name="robots" content="index, follow" />
  <style>
    :root {
      --ink: #16191d; --ink-2: #404853; --ink-3: #6b7480;
      --bg: #ffffff; --surface: #f6f7f9; --border: #e6e8ec; --accent: #2f6df6;
      --maxw: 760px;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.65; font-size: 17px;
    }
    .wrap { max-width: var(--maxw); margin: 0 auto; padding: 56px 24px 96px; }
    h1 { font-size: 30px; line-height: 1.2; margin: 0 0 8px; letter-spacing: -0.01em; }
    h2 { font-size: 20px; margin: 40px 0 10px; letter-spacing: -0.01em; }
    p { color: var(--ink-2); margin: 0 0 16px; }
    ul { color: var(--ink-2); margin: 0 0 16px; padding-left: 22px; }
    li { margin: 0 0 8px; }
    strong { color: var(--ink); font-weight: 650; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    hr { border: 0; border-top: 1px solid var(--border); margin: 32px 0; }
    /* The two bold lines right under the H1 (company + last-updated) read as a subtitle. */
    h1 + p { color: var(--ink-3); font-size: 14px; font-weight: 600; margin-bottom: 2px; }
    h1 + p + p { color: var(--ink-3); font-size: 14px; font-weight: 600; margin-bottom: 24px; }
    h1 + p strong, h1 + p + p strong { color: var(--ink-3); font-weight: 600; }
    footer { margin-top: 56px; padding-top: 20px; border-top: 1px solid var(--border); color: var(--ink-3); font-size: 13px; }
    @media (max-width: 480px) {
      body { font-size: 16px; }
      .wrap { padding: 36px 18px 72px; }
      h1 { font-size: 26px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
{{CONTENT}}
    <footer>&copy; 2026 Kentro AI Labs Inc. &middot; kentrolabs.ai</footer>
  </main>
</body>
</html>
