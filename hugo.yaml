taxonomies:
  category: Categories
  tag: Tags

module:
  hugoVersion:
    extended: true
    min: "0.158.0"

# Performance optimizations
caches:
  assets:
    dir: ":cacheDir/assets"
    maxAge: "0s"
  images:
    dir: ":cacheDir/images"
    maxAge: "8760h"
  modules:
    dir: ":cacheDir/modules"
    maxAge: "8760h"

# Image processing defaults
imaging:
  quality: 85
  resampleFilter: lanczos
  anchor: smart
