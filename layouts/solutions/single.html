{{ define "main" }}
<article>
  <header class="mb-4 bg-primary-600">
    <div class="px-6 py-16 mx-auto max-w-5xl text-center">
      <p class="text-sm font-semibold tracking-wide text-primary-100 uppercase">What we build</p>
      <h1 class="mt-2 text-4xl font-black text-white capitalize md:text-5xl">
        {{ .Title }}
      </h1>
      {{ with .Params.tagline }}
      <p class="mt-3 text-2xl font-light text-primary-50">{{ . }}</p>
      {{ end }}
    </div>
  </header>
  <div class="px-6 pt-6 pb-16 mx-auto prose prose-h1:text-2xl dark:text-white">
    {{ .Content }}
  </div>
</article>
{{ end }}
